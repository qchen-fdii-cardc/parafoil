    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.esm.min.mjs';
    mermaid.initialize({ startOnLoad: true });

    document.addEventListener('DOMContentLoaded', function () {
      const elements = document.getElementsByClassName('language-mermaid');
      for (let i = 0; i < elements.length; i++) {
        const element = elements[i];
        const code = element.textContent;

        
        const tabContainer = document.createElement('div');
        tabContainer.className = 'mermaid-tabs';

        
        const tabButtons = document.createElement('div');
        tabButtons.className = 'mermaid-tab-buttons';

        const diagramButton = document.createElement('button');
        diagramButton.textContent = '图表';
        diagramButton.className = 'mermaid-tab-button active';

        const codeButton = document.createElement('button');
        codeButton.textContent = '源码';
        codeButton.className = 'mermaid-tab-button';

        tabButtons.appendChild(diagramButton);
        tabButtons.appendChild(codeButton);

        
        const diagramPanel = document.createElement('div');
        diagramPanel.className = 'mermaid';
        diagramPanel.textContent = code;

        const codePanel = document.createElement('pre');
        codePanel.className = 'mermaid-code';
        codePanel.style.display = 'none';
        codePanel.textContent = code;

        
        tabContainer.appendChild(tabButtons);
        tabContainer.appendChild(diagramPanel);
        tabContainer.appendChild(codePanel);

        
        element.parentNode.replaceChild(tabContainer, element);

        
        diagramButton.addEventListener('click', () => {
          diagramPanel.style.display = 'block';
          codePanel.style.display = 'none';
          diagramButton.classList.add('active');
          codeButton.classList.remove('active');
        });

        codeButton.addEventListener('click', () => {
          diagramPanel.style.display = 'none';
          codePanel.style.display = 'block';
          diagramButton.classList.remove('active');
          codeButton.classList.add('active');
        });
      }
    });
  </script>
